name: Build Purpur 26.2

on:
  push:
    branches:
      - "ai/26.2-port"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -U clean package

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BlueDream-Lottery-26.2
          path: target/BlueDream-Lottery-1.1.6-26.2.jar
          if-no-files-found: error
